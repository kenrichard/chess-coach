<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chess Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: header with four tabs; below it the board on the left and the lesson / puzzle / game
   panel on the right (stacked on phones). List screens hide the board and use the full width.
   Palette: walnut and cream board, ink-blue accents. */
:root {
  --bg: #f4f1ea; --panel: #fffdf8; --ink: #1d2430; --muted: #5d6674; --line: #ddd6c8;
  --accent: #2f5d8a; --accent-ink: #fff; --accent-soft: #e3ecf5;
  --good: #2e7d4f; --good-soft: #e2f1e7; --bad: #b3362b; --bad-soft: #f8e4e1;
  --hint: #2f6fb3; --hint-soft: #e2edf8; --warn-soft: #fbf0d6; --warn-line: #d9a93a;
  --sq-light: #ecdcbf; --sq-dark: #a7805a; --sq-last: rgba(214, 170, 40, .45); --sq-sel: rgba(60, 120, 200, .45);
  --shadow: 0 1px 2px rgba(30, 25, 15, .12), 0 4px 14px rgba(30, 25, 15, .08);
  --f-display: "Fraunces", Georgia, serif;
  --f-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14171c; --panel: #1c2027; --ink: #e6e8ec; --muted: #9aa3b0; --line: #2e343e;
    --accent: #6fa3d8; --accent-ink: #0d1520; --accent-soft: #1f2c3b;
    --good: #6cc792; --good-soft: #1c3226; --bad: #ef7d70; --bad-soft: #3a2220;
    --hint: #7fb2ea; --hint-soft: #1d2a3a; --warn-soft: #3a3020; --warn-line: #c99a35;
    --sq-light: #d9c6a3; --sq-dark: #8e6a48;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 4px 14px rgba(0, 0, 0, .3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14171c; --panel: #1c2027; --ink: #e6e8ec; --muted: #9aa3b0; --line: #2e343e;
  --accent: #6fa3d8; --accent-ink: #0d1520; --accent-soft: #1f2c3b;
  --good: #6cc792; --good-soft: #1c3226; --bad: #ef7d70; --bad-soft: #3a2220;
  --hint: #7fb2ea; --hint-soft: #1d2a3a; --warn-soft: #3a3020; --warn-line: #c99a35;
  --sq-light: #d9c6a3; --sq-dark: #8e6a48;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 4px 14px rgba(0, 0, 0, .3);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 16px/1.5 var(--f-body); min-height: 100vh; }
button { font: inherit; color: inherit; }
header { display: flex; align-items: center; gap: 16px; padding: 10px 16px; padding-top: max(10px, env(safe-area-inset-top)); border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 5; flex-wrap: wrap; }
header h1 { font: 700 22px/1 var(--f-display); margin: 0; letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; }
header h1 img { width: 28px; height: 28px; }
nav { display: flex; gap: 4px; margin-left: auto; }
nav button { background: none; border: 0; padding: 8px 12px; border-radius: 8px; cursor: pointer; color: var(--muted); font-weight: 700; }
nav button:hover { background: var(--accent-soft); color: var(--ink); }
nav button[aria-current="page"] { background: var(--accent); color: var(--accent-ink); }
@media (max-width: 520px) { header { gap: 8px; } nav { margin-left: 0; width: 100%; justify-content: space-between; } nav button { flex: 1; padding: 8px 4px; } }

#main { max-width: 1120px; margin: 0 auto; padding: 16px; display: block; }
#main .board-wrap { display: none; }
#main.with-board { display: grid; grid-template-columns: minmax(0, 600px) minmax(300px, 1fr); gap: 24px; align-items: start; }
#main.with-board .board-wrap { display: block; position: sticky; top: 76px; }
@media (max-width: 860px) {
  header { position: static; }
  #main.with-board .board-wrap { top: 0; }
  #main.with-board { grid-template-columns: 1fr; gap: 14px; }
  #main.with-board .board-wrap { position: static; max-width: min(600px, calc(100vh - 150px)); width: 100%; margin: 0 auto; }
}
@media (max-width: 860px) and (max-height: 500px) { #main.with-board .board-wrap { max-width: 420px; } }

/* Board */
.board-wrap { position: relative; }
#board { display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr); aspect-ratio: 1; width: 100%; border-radius: 6px; overflow: hidden; box-shadow: var(--shadow); user-select: none; -webkit-user-select: none; touch-action: none; }
.sq { position: relative; min-width: 0; min-height: 0; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; }
.sq.light { background: var(--sq-light); } .sq.dark { background: var(--sq-dark); }
.sq.last::before, .sq.sel::before, .sq[class*="mark-"]::before { content: ""; position: absolute; inset: 0; }
.sq.last::before { background: var(--sq-last); }
.sq.sel::before { background: var(--sq-sel); }
.sq.mark-box::before { background: rgba(40, 130, 255, .42); }
.sq.mark-hint::before { box-shadow: inset 0 0 0 4px var(--hint); background: rgba(47, 111, 179, .18); }
.sq.mark-danger::before { box-shadow: inset 0 0 0 4px var(--bad); background: rgba(179, 54, 43, .22); }
.sq.check { background-image: radial-gradient(circle, rgba(230, 40, 30, .9) 0%, rgba(230, 40, 30, .5) 40%, transparent 72%); }
.sq img { position: relative; width: 92%; height: 92%; pointer-events: none; }
.sq.lifted img { opacity: .3; }
#board.live .sq { cursor: pointer; }
.t-dot { position: absolute; width: 28%; height: 28%; border-radius: 50%; background: rgba(20, 30, 50, .3); pointer-events: none; }
.t-cap { position: absolute; inset: 4%; border-radius: 50%; box-shadow: inset 0 0 0 5px rgba(20, 30, 50, .32); pointer-events: none; }
.coord { position: absolute; font-size: 11px; font-weight: 700; line-height: 1; pointer-events: none; opacity: .8; }
.coord.rank { top: 3px; left: 3px; } .coord.file { bottom: 3px; right: 4px; }
.sq.light .coord { color: var(--sq-dark); } .sq.dark .coord { color: var(--sq-light); }
.ghost { position: fixed; left: 0; top: 0; pointer-events: none; z-index: 50; }
.ghost img { width: 100%; height: 100%; filter: drop-shadow(0 4px 6px rgba(0, 0, 0, .35)); }
#promo { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(10, 15, 25, .45); border-radius: 6px; z-index: 3; }
#promo[hidden] { display: none; }
.promo-card { background: var(--panel); padding: 12px 16px; border-radius: 10px; box-shadow: var(--shadow); text-align: center; }
.promo-card p { margin: 0 0 6px; font-weight: 700; }
.promo-card button { background: var(--sq-light); border: 0; border-radius: 8px; margin: 3px; width: 64px; height: 64px; cursor: pointer; }
.promo-card button:hover { outline: 3px solid var(--accent); }
.promo-card img { width: 100%; height: 100%; }

/* Panel */
#panel { min-width: 0; }
#main.with-board #panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; box-shadow: var(--shadow); }
h2 { font: 700 26px/1.15 var(--f-display); margin: 4px 0 10px; letter-spacing: -.01em; }
.intro { max-width: 680px; } .intro p { color: var(--muted); margin-top: 0; }
h3.group { font: 700 13px/1 var(--f-body); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 26px 0 10px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
.cards.small { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
.card { text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; cursor: pointer; display: flex; flex-direction: column; gap: 4px; box-shadow: var(--shadow); transition: transform .08s, border-color .08s; }
.card:hover { border-color: var(--accent); transform: translateY(-1px); }
.card-title { font-weight: 700; font-size: 17px; }
.card-blurb { color: var(--muted); font-size: 14px; }
.card-meta { color: var(--muted); font-size: 13px; display: flex; gap: 10px; align-items: center; margin-top: auto; padding-top: 4px; }
.tick { color: var(--good); font-weight: 700; }
.crumbs { display: flex; justify-content: space-between; align-items: center; gap: 10px; color: var(--muted); font-size: 14px; flex-wrap: wrap; }
.link { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; font-weight: 700; }
.prose p, .prose ul, .prose ol { margin: 0 0 10px; } .prose ul, .prose ol { padding-left: 22px; } .prose li { margin: 3px 0; }
.task { font-weight: 700; margin: 12px 0 8px; }
.tag { display: inline-block; background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: 13px; padding: 2px 10px; border-radius: 99px; margin: 0; }
.muted { color: var(--muted); } .small { font-size: 14px; }
.counter { margin: 6px 0; }
.fb { border-radius: 10px; padding: 10px 14px; margin: 12px 0; border-left: 4px solid; }
.fb p { margin: 0 0 6px; } .fb p:last-child { margin: 0; }
.fb-good { background: var(--good-soft); border-color: var(--good); }
.fb-bad { background: var(--bad-soft); border-color: var(--bad); }
.fb-hint, .fb-info { background: var(--hint-soft); border-color: var(--hint); }
.warn { background: var(--warn-soft); border: 1px solid var(--warn-line); border-radius: 10px; padding: 12px 14px; margin: 12px 0; }
.warn p { margin: 0 0 8px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 14px; }
.grow { flex: 1; }
.primary, .ghost-btn { border-radius: 8px; padding: 9px 16px; cursor: pointer; font-weight: 700; border: 1px solid var(--accent); }
.primary { background: var(--accent); color: var(--accent-ink); }
.ghost-btn { background: transparent; color: var(--accent); }
.ghost-btn:hover { background: var(--accent-soft); }
button:disabled { opacity: .4; cursor: default; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.values { display: flex; gap: 10px; margin: 6px 0 12px; flex-wrap: wrap; }
.values div { display: flex; flex-direction: column; align-items: center; background: var(--sq-light); border-radius: 8px; padding: 4px 8px 6px; color: #2a2015; }
.values img { width: 44px; height: 44px; }
.notes { list-style: none; padding: 0; margin: 16px 0 0; max-height: 360px; overflow: auto; border-top: 1px solid var(--line); }
.notes li { padding: 8px 4px; border-bottom: 1px solid var(--line); font-size: 15px; color: var(--muted); }
.notes li b { color: var(--ink); margin-right: 4px; }
.notes li.latest { color: var(--ink); background: var(--accent-soft); border-radius: 6px; }
.movelist { list-style: none; padding: 0; margin: 14px 0 6px; max-height: 220px; overflow: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); border-top: 1px solid var(--line); padding-top: 8px; }
.movelist li { display: grid; grid-template-columns: 34px 1fr 1fr; font-variant-numeric: tabular-nums; padding: 2px 0; }
.mn { color: var(--muted); }
.material { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; margin-top: 14px; font-size: 14px; }
.material .label { display: block; color: var(--muted); }
.material .caps { display: flex; flex-wrap: wrap; min-height: 22px; }
.material .caps img { width: 22px; height: 22px; margin-right: -6px; }
.material .score { grid-column: 1 / -1; }
.newgame { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-top: 12px; }
fieldset { border: 0; padding: 0; margin: 0 0 12px; }
legend { font-weight: 700; margin-bottom: 6px; }
.seg { display: flex; border: 1px solid var(--accent); border-radius: 8px; overflow: hidden; width: fit-content; }
.seg label { cursor: pointer; } .seg input { position: absolute; opacity: 0; }
.seg span { display: block; padding: 6px 14px; }
.seg input:checked + span { background: var(--accent); color: var(--accent-ink); }
.seg input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: -3px; }
.check.inline { padding: 0; font-size: 14px; color: var(--muted); }
.walk-ctl { margin-top: 0; } .walk-ctl button { flex: 1; } .walk-count { margin: 10px 0 0; }
.walk-text { border-left: 4px solid var(--line); padding: 4px 0 4px 14px; margin: 8px 0; min-height: 4.5em; }
.walk-text.mine { border-color: var(--accent); }
.walk-text p { margin: 0; }
.lvl, .check { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0; cursor: pointer; }
.lvl input, .check input { margin-top: 5px; accent-color: var(--accent); }
.lvl small, .check small { display: block; color: var(--muted); font-size: 13px; }
footer { max-width: 1120px; margin: 10px auto 30px; padding: 0 16px; color: var(--muted); font-size: 12px; }
.sq.mark-line::before { background: rgba(240, 190, 40, .45); }
.sq.mark-spot::before { background: rgba(240, 190, 40, .6); box-shadow: inset 0 0 0 4px #e0a800; }
.term, .sqref { background: none; border: 0; padding: 0; font: inherit; color: inherit; cursor: pointer; text-decoration: underline dotted var(--accent) 2px; text-underline-offset: 3px; }
.sqref { text-decoration-style: solid; text-decoration-thickness: 1px; }
.term:hover, .sqref:hover { color: var(--accent); }
#termbox { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; padding: 0 12px max(12px, env(safe-area-inset-bottom)); display: flex; justify-content: center; pointer-events: none; }
#termbox[hidden] { display: none; }
.term-card { pointer-events: auto; width: 100%; max-width: 560px; background: var(--panel); border: 1px solid var(--accent); border-radius: 12px; padding: 14px 16px; box-shadow: 0 6px 30px rgba(0, 0, 0, .35); }
.term-card p { margin: 0; } .term-card .row { margin-top: 10px; }
details.why { border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; margin: 10px 0; }
details.why summary { font-weight: 700; cursor: pointer; }
details.why ul { padding-left: 18px; margin: 6px 0; } details.why p { margin: 6px 0; }
ul.line { margin: 6px 0 0; padding-left: 18px; }
.glossary dt { font-weight: 700; font-size: 17px; margin-top: 14px; text-transform: capitalize; }
.glossary dd { margin: 2px 0 0; color: var(--ink); } .glossary dd p { margin: 0; }
.tap-task { font-size: 20px; }
#loading { padding: 40px 16px; text-align: center; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1><img id="logo" alt="">Chess Coach</h1>
  <nav aria-label="Sections">
    <button data-tab="learn">Learn</button>
    <button data-tab="puzzles">Puzzles</button>
    <button data-tab="openings">Openings</button>
    <button data-tab="play">Play</button>
  </nav>
</header>
<div id="main">
  <div class="board-wrap"><div id="board" aria-label="Chess board"></div><div id="promo" hidden></div></div>
  <div id="panel"><p id="loading">Loading…</p></div>
</div>
<div id="termbox" role="dialog" aria-live="polite" hidden></div>
<footer>Piece images: Colin M.L. Burnett ("cburnett"), CC BY-SA 3.0. Rules: chess.js.</footer>

      const before = d.g.fen();
      const bad = explainBad(before, mv);
      if (bad) { const t = tryMove(before, mv); if (t) return this.bounce(before, t, bad + ' That doesn\'t count as a move. Try again.'); }
      try { d.g.move(mv); } catch (e) { return; }
      d.moves++;
      const me = new Chess(fenOf(st.fen)).turn();
      const finish = (ok, html) => { d.over = true; this.solved = ok; board.set({ fen: d.g.fen(), interactive: null }); this.msg = feedback(ok ? 'good' : 'bad', html); this.render(); };
      const lastMv = d.g.history({ verbose: true }).slice(-1)[0];
      board.set({ fen: d.g.fen(), last: lastMv, busy: true, marks: this.boxMarks(d.g.fen()) });
      d.seen.add(T.key(d.g.fen()));
      if (d.g.isCheckmate()) { const w = whyBlock(d.g); finish(true, md(st.done) + w.html); return board.set({ marks: w.marks }); }
      if (d.g.isStalemate()) return finish(false, md('**Stalemate.** The king isn\'t in check but has no move, so the game is a draw. Leave it a square before you make a quiet move. Press *Start over*.'));
      if (d.g.isDraw()) return finish(false, 'That position is a draw. Press <i>Start over</i> to try again.');
      if (d.moves >= st.limit) return finish(false, `That's ${st.limit} moves. Press <i>Start over</i> and box the king in faster.`);
      this.msg = '';
      this.render();
      later(() => {
        const r = E.pickMove(d.g.fen(), 4);
        const res = d.g.move(r);
        d.seen.add(T.key(d.g.fen()));
        board.set({ fen: d.g.fen(), last: res, busy: false, interactive: me, marks: this.boxMarks(d.g.fen()) });
        if (d.g.isDraw()) return finish(false, res.captured ? `The king took your ${NAME[res.captured]}, and a lone king can't be mated. Keep your pieces guarded or out of reach. Press <i>Start over</i>.` : 'That position is a draw. Press <i>Start over</i>.');
        this.render();
      }, 350);
    },
  };

  // ---------------------------------------------------------------- Puzzles
  const THEMES = { mate: 'Mate in one', mate2: 'Mate in two', free: 'Free piece', fork: 'Fork', pin: 'Pin', skewer: 'Skewer' };
  const GROUPS = [['Mate in one', ['mate']], ['Win material', ['free', 'fork', 'pin', 'skewer']], ['Mate in two', ['mate2']]];
  const Puzzles = {
    p: null, g: null, ply: 0, helped: false, msg: '', done: false, offLine: false,
    enter() { if (this.p) this.render(); else this.list(); },
    list() {
      bump(); layout(false); this.p = null;
      const solved = Object.keys(progress.puzzles).length;
      panel.innerHTML = `<div class="intro"><h2>Puzzles</h2><p>Each puzzle has one strong move to find. Tactics like these decide most beginner games. ${solved} of ${PUZZLES.length} solved.</p></div>` +
        GROUPS.map(([name, themes]) => `<h3 class="group">${name}</h3><div class="cards small">` + PUZZLES.filter((p) => themes.includes(p.theme)).map((p) => {
          const s = progress.puzzles[p.id];
          return `<button class="card" data-p="${p.id}"><span class="card-title">${esc(p.title)}</span><span class="card-meta">${THEMES[p.theme]}${s ? `<span class="tick">${s === 'clean' ? '✓ first try' : '✓ solved'}</span>` : ''}</span></button>`;
        }).join('') + '</div>').join('');
      panel.onclick = (e) => { const b = e.target.closest('[data-p]'); if (b) this.open(b.dataset.p); };
    },
    open(id) {
      this.p = PUZZLES.find((p) => p.id === id);
      bump();
      this.g = new Chess(this.p.fen); this.ply = 0; this.helped = false; this.msg = ''; this.done = false; this.offLine = false;
      layout(true);
      board.onMove = (mv) => this.onMove(mv);
      board.set({ fen: this.p.fen, last: null, marks: {}, orientation: this.g.turn(), interactive: this.g.turn(), busy: false });
      this.render();
    },
    goal() {
      const t = this.p.theme;
      return t === 'mate' ? 'Checkmate in one move.' : t === 'mate2' ? 'Checkmate in two moves.' : 'Win material.';
    },
    render() {
      const P = this.p, i = PUZZLES.indexOf(P), side = SIDE[new Chess(P.fen).turn()];
      panel.innerHTML = `<div class="crumbs"><button data-act="list" class="link">← All puzzles</button><span>Puzzle ${i + 1} of ${PUZZLES.length}</span></div>
        <h2>${esc(P.title)}</h2><p class="tag">${THEMES[P.theme]}</p>
        <p class="task">${side} to move. ${this.goal()}</p>${this.msg}
        <div class="row">${this.done ? '<button data-act="retry" class="ghost-btn">Try again</button>' : '<button data-act="hint" class="ghost-btn">Hint</button><button data-act="solve" class="ghost-btn">Show solution</button>'}
        <span class="grow"></span>${i < PUZZLES.length - 1 ? `<button data-act="next" class="${this.done ? 'primary' : 'ghost-btn'}">Next puzzle</button>` : ''}</div>`;
      panel.onclick = (e) => {
        const a = e.target.closest('[data-act]'); if (!a) return;
        const act = a.dataset.act;
        if (act === 'list') this.list();
        if (act === 'retry') this.open(P.id);
        if (act === 'next') this.open(PUZZLES[i + 1].id);
        if (act === 'hint') { this.helped = true; this.msg = feedback('hint', md(P.hint)); this.render(); }
        if (act === 'solve') this.solve();
      };
    },
    expected() { return this.offLine ? null : this.p.line[this.ply]; },
    solve() {
      this.helped = true;
      const fen = this.g.fen();
      let san = this.expected();
      if (!san || !tryMove(fen, san)) { const h = this.p.theme.startsWith('mate') ? E.mateMoves(fen, this.p.theme === 'mate2' ? 2 - this.ply / 2 : 1)[0] : E.bestMove(fen, 3).move; san = h && tryMove(fen, h).r.san; }
      const t = tryMove(fen, san);
      board.set({ marks: { [t.r.from]: 'hint', [t.r.to]: 'hint' } });
      this.msg = feedback('hint', `The move is <b>${esc(t.r.san)}</b>: ${describe(t.r)}. Play it on the board.`);
      this.render();
    },
    accepts(t) {
      const P = this.p, last = this.ply >= P.line.length - 1;
      if (P.theme.startsWith('mate') && (last || this.offLine) && t.g.isCheckmate()) return true;
      const ok = [this.expected(), ...(this.ply === 0 ? P.also || [] : [])].filter(Boolean).map(stripSan);
      if (ok.includes(stripSan(t.r.san))) return true;
      if (this.offLine && !P.theme.startsWith('mate')) { // after an unexpected reply: any move about as good as the best
        const sc = E.rootScores(this.g.fen(), 3);
        const mine = sc.find((s) => s.move.from === t.r.from && s.move.to === t.r.to);
        return mine && mine.score >= sc[0].score - 60;
      }
      if (P.theme === 'mate2' && this.ply === 0) return E.mateMoves(this.g.fen(), 2).some((m) => m.from === t.r.from && m.to === t.r.to);
      return false;
    },
    onMove(mv) {
      if (this.done) return;
      const fen = this.g.fen();
      const t = tryMove(fen, mv); if (!t) return;
      if (this.accepts(t)) {
        if (stripSan(t.r.san) !== stripSan(this.expected() || '')) this.offLine = true;
        this.g.move(mv); this.ply++;
        const finished = this.g.isCheckmate() || (!this.offLine && this.ply >= this.p.line.length) || (this.offLine && !this.p.theme.startsWith('mate') && this.ply >= this.p.line.length);
        if (finished) return this.finish(t.r);
        board.set({ fen: this.g.fen(), last: t.r, marks: {}, busy: true });
        this.msg = feedback('good', `<b>${esc(t.r.san)}</b>. Good! Keep going.`);
        this.render();
        later(() => this.reply(), 550);
        return;
      }
      this.helped = true;
      let why;
      if (this.p.theme.startsWith('mate')) {
        if (t.g.isStalemate()) why = 'That is stalemate, a draw. Look for a check.';
        else if (t.g.inCheck()) why = `<b>${esc(t.r.san)}</b> is check, but the king can still escape or the checking piece can be taken.`;
        else why = explainBad(fen, mv) || `<b>${esc(t.r.san)}</b> isn't check. Mating attacks almost always start with checks.`;
      } else {
        why = explainBad(fen, mv) || `<b>${esc(t.r.san)}</b> doesn't win anything. ${this.p.theme === 'fork' ? 'Look for a move that attacks two pieces at once.' : this.p.theme === 'free' ? 'Look for a piece that is attacked and not guarded.' : 'Look at pieces lined up on the same line.'}`;
      }
      board.set({ fen: t.g.fen(), last: t.r, busy: true });
      this.msg = feedback('bad', why + ' Try again.');
      this.render();
      later(() => board.set({ fen: this.g.fen(), last: null, busy: false }), 1100);
    },
    reply() {
      const fen = this.g.fen();
      let san = !this.offLine && this.p.line[this.ply];
      let r = san && tryMove(fen, san) ? this.g.move(san) : null;
      if (!r) { this.offLine = true; r = this.g.move(E.bestMove(fen, 3).move); }
      this.ply++;
      board.set({ fen: this.g.fen(), last: r, busy: false });
      this.msg = feedback('info', `${SIDE[r.color]} answers <b>${esc(r.san)}</b>. Your move.`);
      this.render();
    },
    finish(r) {
      this.done = true;
      const prev = progress.puzzles[this.p.id];
      progress.puzzles[this.p.id] = (prev === 'clean' || !this.helped) ? 'clean' : 'helped';
      saveProgress();
      const w = this.g.isCheckmate() ? whyBlock(this.g) : null;
      board.set({ fen: this.g.fen(), last: r, interactive: null, busy: false, marks: w ? w.marks : {} });
      const line = this.g.history({ verbose: true }).map((m) => `<li><b>${esc(m.san)}</b>: ${describe(m)}</li>`).join('');
      this.msg = feedback('good', `<b>Solved!</b> ${this.g.isCheckmate() ? 'Checkmate.' : 'You win material.'} ${this.helped ? '' : 'First try.'}<ul class="line">${line}</ul>`) + (w ? w.html : '');
      this.render();
    },
  };

  // ---------------------------------------------------------------- Openings
  const PIECE_WORD = { N: 'a knight', B: 'a bishop', R: 'a rook', Q: 'your queen', K: 'your king', O: 'your king (castle)' };
  const Openings = {
    o: null, g: null, idx: 0, recall: false, wrong: 0, msg: '', done: false,
    enter() { if (this.o) this.render(); else this.list(); },
    list() {
      bump(); layout(false); this.o = null;
      panel.innerHTML = `<div class="intro"><h2>Openings</h2><p>Learn a few real openings move by move. The computer plays the other side. Every move comes with a reason, because knowing <i>why</i> lets you handle it when your opponent plays something else.</p></div>` +
        ['w', 'b'].map((side) => `<h3 class="group">As ${SIDE[side]}</h3><div class="cards">` + OPENINGS.filter((o) => o.side === side).map((o) =>
          `<button class="card" data-o="${o.id}"><span class="card-title">${esc(o.name)}</span><span class="card-blurb">${esc(o.blurb)}</span><span class="card-meta">${Math.ceil(o.moves.length / 2)} moves${progress.openings[o.id] ? `<span class="tick">✓ ${progress.openings[o.id]}×</span>` : ''}</span></button>`).join('') + '</div>').join('');
      panel.onclick = (e) => { const b = e.target.closest('[data-o]'); if (b) this.open(b.dataset.o, false); };
    },
    open(id, recall) {
      this.o = OPENINGS.find((o) => o.id === id);
      bump();
      this.g = new Chess(); this.idx = 0; this.recall = recall; this.wrong = 0; this.msg = ''; this.done = false;
      layout(true);
      board.onMove = (mv) => this.onMove(mv);
      board.set({ fen: START, last: null, marks: {}, orientation: this.o.side, interactive: this.o.side, busy: false });
      this.advance();
    },
    mine() { return this.g.turn() === this.o.side; },
    advance() {
      if (this.idx >= this.o.moves.length) {
        this.done = true;
        progress.openings[this.o.id] = (progress.openings[this.o.id] || 0) + 1; saveProgress();
        board.set({ interactive: null, marks: {} });
        this.msg = feedback('good', `<b>Line complete.</b> ${this.recall ? 'You played it from memory.' : 'Now try it from memory, or play on from here against the computer.'}`);
        return this.render();
      }
      if (!this.mine()) {
        board.set({ busy: true });
        this.render();
        later(() => {
          const r = this.g.move(this.o.moves[this.idx][0]); this.idx++;
          board.set({ fen: this.g.fen(), last: r, busy: false, marks: {} });
          this.advance();
        }, 450);
        return;
      }
      this.wrong = 0;
      this.render();
    },
    render() {
      const O = this.o;
      const played = O.moves.slice(0, this.idx);
      const notes = played.map(([san, why], i) => {
        const num = Math.floor(i / 2) + 1, dots = i % 2 ? '…' : '.';
        const mineMv = (i % 2 === 0) === (O.side === 'w');
        return `<li class="${i === this.idx - 1 ? 'latest' : ''} ${mineMv ? 'mine' : ''}"><b>${num}${dots} ${esc(san)}</b> ${md(why).replace(/^<p>|<\/p>$/g, '')}</li>`;
      }).join('');
      let next = '';
      if (!this.done && this.mine() && this.idx < O.moves.length) {
        const [san, why] = O.moves[this.idx];
        next = this.recall ? `<p class="task">Your move. Play the next move from memory.</p>` :
          `<p class="task">Your move: play <b>${esc(san)}</b>.</p><p class="muted">${md(why).replace(/^<p>|<\/p>$/g, '')}</p>`;
      } else if (!this.done) next = '<p class="task muted">Computer is moving…</p>';
      const end = this.done ? `<button data-act="recall" class="primary">Practice from memory</button><button data-act="play" class="ghost-btn">Play on vs computer</button>` :
        (this.recall && this.mine() ? '<button data-act="show" class="ghost-btn">Show me</button>' : '');
      panel.innerHTML = `<div class="crumbs"><button data-act="list" class="link">← All openings</button><span>As ${SIDE[O.side]}${this.recall ? ' · from memory' : ''}</span></div>
        <h2>${esc(O.name)}</h2>${next}${this.msg}
        <div class="row">${end}<span class="grow"></span><button data-act="restart" class="ghost-btn">Restart</button></div>
        <ol class="notes">${notes}</ol>`;
      const latest = panel.querySelector('.notes .latest'); if (latest) latest.scrollIntoView({ block: 'nearest' });
      panel.onclick = (e) => {
        const a = e.target.closest('[data-act]'); if (!a) return;
        const act = a.dataset.act;
        if (act === 'list') this.list();
        if (act === 'restart') this.open(O.id, this.recall);
        if (act === 'recall') this.open(O.id, true);
        if (act === 'show') this.hintMove(true);
        if (act === 'play') { setTab('play'); Play.newGame({ fen: this.g.fen(), color: O.side, level: Play.s.level, coach: Play.s.coach }); }
      };
    },
    hintMove(full) {
      const t = tryMove(this.g.fen(), this.o.moves[this.idx][0]);
      const word = PIECE_WORD[t.r.san[0]] || `your ${t.r.from[0]}-pawn`;
      if (full) { board.set({ marks: { [t.r.from]: 'hint', [t.r.to]: 'hint' } }); this.msg = feedback('hint', `The move is <b>${esc(t.r.san)}</b>.`); }
      else board.set({ marks: { [t.r.from]: 'hint' } });
      return word;
    },
    onMove(mv) {
      if (this.done || !this.mine()) return;
      const [san] = this.o.moves[this.idx];
      const t = tryMove(this.g.fen(), mv); if (!t) return;
      if (stripSan(t.r.san) === stripSan(san)) {
        const r = this.g.move(mv); this.idx++; this.msg = '';
        board.set({ fen: this.g.fen(), last: r, marks: {} });
        return this.advance();
      }
      this.wrong++;
      const fen = this.g.fen();
      board.set({ fen: t.g.fen(), last: t.r, busy: true });
      const bad = explainBad(fen, mv);
      const word = PIECE_WORD[san[0]] || `your ${tryMove(fen, san).r.from[0]}-pawn`;
      const html = (bad ? bad + ' ' : `<b>${esc(t.r.san)}</b> is legal, but this line plays something else. `) + (this.wrong === 1 ? `Hint: move ${word}.` : 'The squares are marked.');
      this.msg = feedback('bad', html);
      this.render();
      later(() => {
        board.set({ fen, last: null, busy: false });
        if (this.wrong >= 2) this.hintMove(true), this.render();
      }, 1100);
    },
  };

  // ---------------------------------------------------------------- Play
  const Play = {
    s: Object.assign({ level: 1, color: 'w', coach: true, start: START, moves: [] }, store.get('cc.play', {})),
    stats: store.get('cc.stats', {}),
    g: null, pending: null, thinking: false, hint: null, showNew: false, recorded: false,
    init() {
      this.g = new Chess(this.s.start);
      try { for (const m of this.s.moves) this.g.move(m); } catch (e) { this.g = new Chess(this.s.start); this.s.moves = []; }
      this.recorded = this.g.isGameOver();
    },
    save() { this.s.moves = this.g.history(); store.set('cc.play', this.s); },
    enter() {
      bump(); layout(true); this.thinking = false; this.pending = null;
      board.onMove = (mv) => this.onMove(mv);
      board.set({ fen: this.g.fen(), last: this.lastMove(), marks: {}, orientation: this.s.color, interactive: this.s.color, busy: false });
      this.render();
      this.maybeComputer();
    },
    lastMove() { return this.g.history({ verbose: true }).slice(-1)[0] || null; },
    newGame(o) {
      const color = o.color === 'random' ? (Math.random() < 0.5 ? 'w' : 'b') : o.color;
      Object.assign(this.s, { level: o.level, coach: o.coach, color, start: o.fen || START, moves: [] });
      this.g = new Chess(this.s.start); this.pending = null; this.hint = null; this.showNew = false; this.recorded = false;
      this.save();
      this.enter();
    },
    maybeComputer() {
      if (this.g.isGameOver() || this.g.turn() === this.s.color || this.thinking || this.pending) return;
      this.thinking = true; board.set({ busy: true }); this.render();
      later(() => {
        const mv = E.pickMove(this.g.fen(), this.s.level);
        const r = this.g.move(mv);
        this.thinking = false; this.save();
        board.set({ fen: this.g.fen(), last: r, busy: false, marks: {} });
        this.afterMove();
      }, 380);
    },
    afterMove() {
      if (this.g.isGameOver() && !this.recorded) {
        this.recorded = true;
        const k = this.s.level, st = this.stats[k] = this.stats[k] || { w: 0, l: 0, d: 0 };
        if (this.g.isCheckmate()) st[this.g.turn() === this.s.color ? 'l' : 'w']++; else st.d++;
        store.set('cc.stats', this.stats);
      }
      this.render();
      this.maybeComputer();
    },
    onMove(mv) {
      if (this.thinking || this.pending || this.g.turn() !== this.s.color) return;
      this.hint = null;
      if (this.s.coach) {
        const w = E.checkMove(this.g.fen(), mv);
        if (w) {
          this.pending = { mv, w };
          const t = tryMove(this.g.fen(), mv);
          board.set({ fen: t.g.fen(), last: t.r, busy: true, marks: { [w.from]: 'danger', [w.to]: 'danger' } });
          return this.render();
        }
      }
      this.commit(mv);
    },
    commit(mv) {
      const r = this.g.move(mv); this.pending = null; this.save();
      board.set({ fen: this.g.fen(), last: r, busy: false, marks: {} });
      this.afterMove();
    },
    cancelPending() {
      this.pending = null;
      board.set({ fen: this.g.fen(), last: this.lastMove(), busy: false, marks: {} });
      this.render();
    },
    takeBack() {
      if (this.thinking) return;
      if (this.pending) return this.cancelPending();
      const n = this.g.history().length;
      if (!n) return;
      this.g.undo();
      if (this.g.turn() !== this.s.color && this.g.history().length) this.g.undo();
      this.recorded = false; this.hint = null; this.save();
      board.set({ fen: this.g.fen(), last: this.lastMove(), marks: {}, busy: false });
      this.render();
      this.maybeComputer();
    },
    showHint() {
      if (this.g.turn() !== this.s.color || this.g.isGameOver()) return;
      const h = E.hint(this.g.fen());
      this.hint = h;
      board.set({ marks: { [h.from]: 'hint', [h.to]: 'hint' } });
      this.render();
    },
    status() {
      const g = this.g, you = this.s.color;
      if (g.isCheckmate()) return g.turn() === you ? feedback('bad', '<b>Checkmate. The computer wins.</b> Use <i>Take back</i> to see what went wrong, or start a new game.') : feedback('good', '<b>Checkmate. You win!</b>');
      if (g.isStalemate()) return feedback('info', `<b>Stalemate, a draw.</b> ${SIDE[g.turn()]} isn't in check but has no legal move.`);
      if (g.isInsufficientMaterial()) return feedback('info', '<b>Draw.</b> Neither side has enough pieces left to checkmate.');
      if (g.isThreefoldRepetition()) return feedback('info', '<b>Draw by repetition.</b> The same position came up three times.');
      if (g.isDraw()) return feedback('info', '<b>Draw.</b> Fifty moves passed without a capture or a pawn move.');
      if (this.thinking) return '<p class="task muted">Computer is thinking…</p>';
      return `<p class="task">${g.turn() === you ? 'Your move' : 'Computer to move'}${g.inCheck() ? ': <b>you are in check!</b>' : '.'}</p>`;
    },
    material() {
      const start = { p: 8, n: 2, b: 2, r: 2, q: 1 };
      const have = { w: { p: 0, n: 0, b: 0, r: 0, q: 0 }, b: { p: 0, n: 0, b: 0, r: 0, q: 0 } };
      for (const row of this.g.board()) for (const p of row) if (p && p.type !== 'k') have[p.color][p.type]++;
      let diff = 0;
      const taken = (c) => { // pieces of color c that are gone
        let h = '';
        for (const t of ['q', 'r', 'b', 'n', 'p']) for (let i = have[c][t]; i < start[t]; i++) h += pieceImg(c + t.toUpperCase());
        return h;
      };
      for (const t in start) diff += (have.w[t] - have.b[t]) * ({ p: 1, n: 3, b: 3, r: 5, q: 9 })[t];
      const you = this.s.color, lead = you === 'w' ? diff : -diff;
      return `<div class="material"><div><span class="label">You took</span><span class="caps">${taken(you === 'w' ? 'b' : 'w') || '—'}</span></div><div><span class="label">Computer took</span><span class="caps">${taken(you) || '—'}</span></div>
        <div class="score">${lead > 0 ? `You're ahead by <b>${lead}</b>` : lead < 0 ? `You're behind by <b>${-lead}</b>` : 'Material is even'}</div></div>`;
    },
    render() {
      const lv = E.LEVELS.find((l) => l.id === this.s.level);
      const h = this.g.history();
      let moves = '';
      const startBlack = new Chess(this.s.start).turn() === 'b';
      const offset = startBlack ? 1 : 0;
      const n0 = new Chess(this.s.start).moveNumber();
      for (let i = -offset; i < h.length; i += 2) {
        moves += `<li><span class="mn">${n0 + (i + offset) / 2}.</span><span>${i < 0 ? '…' : esc(h[i])}</span><span>${h[i + 1] ? esc(h[i + 1]) : ''}</span></li>`;
      }
      let warn = '';
      if (this.pending) {
        const w = this.pending.w;
        const them = this.s.color === 'w' ? 'Black' : 'White';
        warn = `<div class="warn"><p><b>Wait! Look at ${esc(w.mover.san)} again.</b></p><p>${w.kind === 'mate' ? `${them} can answer <b>${esc(w.reply)}</b>, and that's checkmate.` : `${them} can answer <b>${esc(w.reply)}</b> and win your ${w.lost}.`}</p>
          <div class="row"><button data-act="undo-pending" class="primary">Pick another move</button><button data-act="force" class="ghost-btn">Play it anyway</button></div></div>`;
      }
      const hint = this.hint ? feedback('hint', `Try <b>${esc(this.hint.san)}</b>. ${esc(this.hint.why)}`) : '';
      const rec = this.stats[this.s.level];
      const form = this.showNew ? this.formHtml() : '';
      panel.innerHTML = `<div class="crumbs"><span>Play the computer</span><span>${esc(lv.name)} · you are ${SIDE[this.s.color]}${this.s.coach ? ' · coach on' : ''}</span></div>
        ${this.status()}${warn}${hint}
        <div class="row tools"><button data-act="new" class="${this.g.isGameOver() ? 'primary' : 'ghost-btn'}">New game</button><button data-act="back" class="ghost-btn" ${h.length || this.pending ? '' : 'disabled'}>Take back</button><button data-act="hint" class="ghost-btn" ${this.g.turn() === this.s.color && !this.g.isGameOver() && !this.pending ? '' : 'disabled'}>Hint</button><button data-act="flip" class="ghost-btn" aria-label="Flip board">Flip</button></div>
        ${form}
        ${this.material()}
        <ol class="movelist">${moves || '<li class="muted">No moves yet.</li>'}</ol>
        ${rec ? `<p class="muted small">Your record against ${esc(lv.name)}: ${rec.w} won, ${rec.l} lost, ${rec.d} drawn.</p>` : ''}`;
      const ml = panel.querySelector('.movelist'); if (ml) ml.scrollTop = ml.scrollHeight;
      panel.onclick = (e) => {
        const a = e.target.closest('[data-act]'); if (!a) return;
        const act = a.dataset.act;
        if (act === 'new') { this.showNew = !this.showNew; this.render(); }
        if (act === 'back') this.takeBack();
        if (act === 'hint') this.showHint();
        if (act === 'flip') board.set({ orientation: board.orientation === 'w' ? 'b' : 'w' });
        if (act === 'undo-pending') this.cancelPending();
        if (act === 'force') this.commit(this.pending.mv);
        if (act === 'start') {
          const f = panel.querySelector('form');
          this.newGame({ color: f.color.value, level: +f.level.value, coach: f.coach.checked });
        }
      };
    },
    formHtml() {
      const s = this.s;
      return `<form class="newgame" onsubmit="return false">
        <fieldset><legend>Your color</legend><div class="seg">${[['w', 'White'], ['b', 'Black'], ['random', 'Random']].map(([v, l]) => `<label><input type="radio" name="color" value="${v}" ${s.color === v ? 'checked' : ''}><span>${l}</span></label>`).join('')}</div></fieldset>
        <fieldset><legend>Opponent</legend>${E.LEVELS.map((l) => `<label class="lvl"><input type="radio" name="level" value="${l.id}" ${s.level === l.id ? 'checked' : ''}><span><b>${esc(l.name)}</b><small>${esc(l.blurb)}</small></span></label>`).join('')}</fieldset>
        <label class="check"><input type="checkbox" name="coach" ${s.coach ? 'checked' : ''}><span><b>Coach</b><small>Warns you before a move that gives away a piece or allows checkmate.</small></span></label>
        <div class="row"><span class="grow"></span><button type="button" data-act="start" class="primary">Start game</button></div></form>`;
    },
  };
  Play.init();

  // ---------------------------------------------------------------- Tabs
  const TABS = { learn: Learn, puzzles: Puzzles, openings: Openings, play: Play };
  let tab = store.get('cc.tab', 'learn');
  if (!TABS[tab]) tab = 'learn';
  function setTab(t) {
    tab = t; store.set('cc.tab', t);
    document.querySelectorAll('nav [data-tab]').forEach((b) => b.setAttribute('aria-current', b.dataset.tab === t ? 'page' : 'false'));
  }
  document.querySelector('nav').addEventListener('click', (e) => {
    const b = e.target.closest('[data-tab]'); if (!b) return;
    // Clicking the current tab again goes back to its list.
    if (b.dataset.tab === tab && TABS[tab].list) { TABS[tab].list(); return; }
    setTab(b.dataset.tab); TABS[tab].enter();
  });
  setTab(tab);
  TABS[tab].enter();
}
</script>
<script type="module">
try {
  const { Chess } = await import('https://cdn.jsdelivr.net/npm/chess.js@1.4.0/dist/esm/chess.js');
  startApp(Chess);
} catch (e) {
  document.getElementById('panel').innerHTML = '<p id="loading">Couldn\'t load the chess rules library. Check your internet connection and reload.</p>';
  console.error(e);
}
</script>
</body>
</html>
